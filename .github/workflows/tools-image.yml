name: Kubernetes tools image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tools-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the toolbox
        run: |
          docker buildx build --platform linux/amd64 --load --tag k8s-tools:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Smoke-test the final image offline
        run: |
          docker run --rm -i --network none \
            --mount "type=bind,src=$PWD/versions.env,dst=/tmp/versions.env,readonly" \
            k8s-tools:ci bash -s < tests/tools-image.sh
      - name: Save the tested image
        if: github.event_name == 'push'
        run: docker save k8s-tools:ci -o "$RUNNER_TEMP/k8s-tools.tar"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: k8s-tools
          path: ${{ runner.temp }}/k8s-tools.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: k8s-tools
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image to GHCR
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/k8s-tools"
          docker load -i "$RUNNER_TEMP/k8s-tools.tar"
          docker tag k8s-tools:ci "$image:sha-$GITHUB_SHA"
          docker tag k8s-tools:ci "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
